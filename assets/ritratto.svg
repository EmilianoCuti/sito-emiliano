<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 880" width="660" height="880" role="img" aria-label="Ritratto tipografico: le iniziali E. C. su fondo scuro">
  <defs>
    <filter id="grano" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="rumore"/>
      <feColorMatrix in="rumore" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.16"/>
      </feComponentTransfer>
    </filter>
    <linearGradient id="lastra" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#221e18"/>
      <stop offset="0.55" stop-color="#17140f"/>
      <stop offset="1" stop-color="#0f0d0a"/>
    </linearGradient>
  </defs>

  <rect width="660" height="880" fill="url(#lastra)"/>
  <rect width="660" height="880" fill="#000" filter="url(#grano)" opacity="0.5"/>

  <rect x="34" y="34" width="592" height="812" fill="none" stroke="#f7f3ea" stroke-opacity="0.28"/>

  <text x="330" y="470" text-anchor="middle" fill="#f7f3ea"
        font-family="Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif"
        font-size="148" letter-spacing="6">E.C.</text>

  <line x1="270" y1="540" x2="390" y2="540" stroke="#f7f3ea" stroke-opacity="0.42"/>

  <text x="330" y="586" text-anchor="middle" fill="#f7f3ea" fill-opacity="0.62"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="15" letter-spacing="7">GIORNALISTA</text>
</svg>
